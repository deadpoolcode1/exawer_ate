!
! Attachment circuits. A vlan-based EVI binds SUB-interfaces,
! never the port itself - the device rejects the commit otherwise.
!
interface int1
 admin-state up
!
interface int1.100
 l2-transport enable
!
interface int2
 admin-state up
!
interface int2.100
 l2-transport enable
!
interface int3
 admin-state up
!
interface int3.100
 l2-transport enable
!
l2-services
 evpn evi-1
  service-type vlan-based
  auto-discovery
  auto-discovery import-rt 65000:1
  auto-discovery export-rt 65000:1
  interface int1.100
  interface int2.100
  interface int3.100
 !
