!
! EVPN service evi-1: what TC01 creates, loaded by TC02 and TC03.
! Loaded AFTER EVPN_Base.cfg, which creates the sub-interfaces bound
! here. Shape read back off pc-3080 (8.7.0), 2026-10-01.
!
l2-services
 evpn evi-1
  service-type vlan-based
  interface int2.1001
  !
  interface int3.1002
  !
  interface int3.1003
  !
  auto-discovery
   export-rt 65000:1
   import-rt 65000:1
  !
 !
!
